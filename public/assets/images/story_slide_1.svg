<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#241a44"/>
      <stop offset="100%" stop-color="#0F0B1E"/>
    </radialGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1440"/>
      <stop offset="100%" stop-color="#140e2c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <!-- stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="60" r="2"/><circle cx="740" cy="90" r="2"/><circle cx="120" cy="520" r="2"/>
    <circle cx="700" cy="540" r="2"/><circle cx="400" cy="40" r="2"/><circle cx="40" cy="300" r="1.5"/>
    <circle cx="760" cy="300" r="1.5"/>
  </g>

  <text x="400" y="55" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="34" fill="#FFB800">Meet the Pattern Family</text>

  <!-- Card 1: Arithmetic sequence -->
  <g transform="translate(60,90)">
    <rect width="320" height="200" rx="24" fill="url(#cardA)" stroke="#06B6D4" stroke-width="3"/>
    <text x="160" y="36" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="20" fill="#06B6D4">Arithmetic</text>
    <g font-family="Outfit, sans-serif" font-weight="900" font-size="22" fill="#F3F4F6">
      <rect x="30" y="70" width="46" height="46" rx="10" fill="#161129" stroke="#06B6D4" stroke-width="2"/><text x="53" y="100" text-anchor="middle">2</text>
      <rect x="95" y="70" width="46" height="46" rx="10" fill="#161129" stroke="#F59E0B" stroke-width="2"/><text x="118" y="100" text-anchor="middle">5</text>
      <rect x="160" y="70" width="46" height="46" rx="10" fill="#161129" stroke="#10B981" stroke-width="2"/><text x="183" y="100" text-anchor="middle">8</text>
      <rect x="225" y="70" width="46" height="46" rx="10" fill="#161129" stroke="#EC4899" stroke-width="2"/><text x="248" y="100" text-anchor="middle">11</text>
    </g>
    <path d="M76 93 L95 93" stroke="#FFB800" stroke-width="4" marker-end="url(#arrow1)"/>
    <path d="M141 93 L160 93" stroke="#FFB800" stroke-width="4" marker-end="url(#arrow1)"/>
    <path d="M206 93 L225 93" stroke="#FFB800" stroke-width="4" marker-end="url(#arrow1)"/>
    <text x="160" y="160" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700" font-size="15" fill="#C4B5FD">+3 every time</text>
  </g>

  <!-- Card 2: Growing figures -->
  <g transform="translate(420,90)">
    <rect width="320" height="200" rx="24" fill="url(#cardA)" stroke="#F59E0B" stroke-width="3"/>
    <text x="160" y="36" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="20" fill="#F59E0B">Growing Figures</text>
    <g fill="#8B5CF6" opacity="0.85">
      <rect x="30" y="75" width="14" height="14" rx="2"/>
      <rect x="90" y="75" width="14" height="14" rx="2"/><rect x="106" y="75" width="14" height="14" rx="2"/>
      <rect x="160" y="75" width="14" height="14" rx="2"/><rect x="176" y="75" width="14" height="14" rx="2"/><rect x="192" y="75" width="14" height="14" rx="2"/>
      <rect x="240" y="75" width="14" height="14" rx="2"/><rect x="256" y="75" width="14" height="14" rx="2"/><rect x="272" y="75" width="14" height="14" rx="2"/><rect x="288" y="75" width="14" height="14" rx="2"/>
    </g>
    <text x="37" y="115" text-anchor="middle" font-family="Outfit" font-size="12" fill="#C4B5FD">Fig1</text>
    <text x="104" y="115" text-anchor="middle" font-family="Outfit" font-size="12" fill="#C4B5FD">Fig2</text>
    <text x="182" y="115" text-anchor="middle" font-family="Outfit" font-size="12" fill="#C4B5FD">Fig3</text>
    <text x="270" y="115" text-anchor="middle" font-family="Outfit" font-size="12" fill="#C4B5FD">Fig4</text>
    <text x="160" y="160" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700" font-size="15" fill="#C4B5FD">+1 tile each figure</text>
  </g>

  <!-- Card 3: Repeating pattern -->
  <g transform="translate(60,320)">
    <rect width="320" height="200" rx="24" fill="url(#cardA)" stroke="#10B981" stroke-width="3"/>
    <text x="160" y="36" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="20" fill="#10B981">Repeating Pattern</text>
    <g font-size="34" font-family="sans-serif">
      <text x="45" y="105">🔺</text><text x="95" y="105">🔵</text><text x="145" y="105">🔺</text>
      <text x="195" y="105">🔵</text><text x="245" y="105">🔺</text><text x="295" y="105">🔵</text>
    </g>
    <text x="160" y="160" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700" font-size="15" fill="#C4B5FD">Cycles in a loop</text>
  </g>

  <!-- Card 4: Systematic Lists -->
  <g transform="translate(420,320)">
    <rect width="320" height="200" rx="24" fill="url(#cardA)" stroke="#EC4899" stroke-width="3"/>
    <text x="160" y="36" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="20" fill="#EC4899">Systematic Lists</text>
    <g stroke="#EC4899" stroke-width="1.5" fill="#EC489930">
      <rect x="50" y="65" width="60" height="34"/><rect x="112" y="65" width="60" height="34"/>
      <rect x="50" y="101" width="60" height="34"/><rect x="112" y="101" width="60" height="34"/>
      <rect x="50" y="137" width="60" height="34"/><rect x="112" y="137" width="60" height="34"/>
    </g>
    <text x="160" y="180" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700" font-size="15" fill="#C4B5FD">Every outcome, in order</text>
  </g>

  <defs>
    <marker id="arrow1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#FFB800"/>
    </marker>
  </defs>
</svg>
