<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#3a1440"/>
      <stop offset="100%" stop-color="#0F0B1E"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="60" r="2"/><circle cx="740" cy="80" r="2"/><circle cx="90" cy="540" r="2"/><circle cx="730" cy="530" r="2"/>
  </g>

  <text x="400" y="55" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="32" fill="#FFB800">Finding the Missing Term</text>
  <text x="400" y="90" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="800" font-size="20" fill="#EC4899">🕵️ Detective Time!</text>

  <!-- Sequence boxes -->
  <g transform="translate(85,140)">
    <g font-family="Outfit" font-weight="900" font-size="30" fill="#F3F4F6">
      <rect x="0" y="0" width="80" height="70" rx="14" fill="#161129" stroke="#06B6D4" stroke-width="4"/><text x="40" y="45" text-anchor="middle">4</text>
      <rect x="120" y="0" width="80" height="70" rx="14" fill="#161129" stroke="#F59E0B" stroke-width="4"/><text x="160" y="45" text-anchor="middle">9</text>
      <rect x="240" y="0" width="80" height="70" rx="14" fill="#161129" stroke="#10B981" stroke-width="4"/><text x="280" y="45" text-anchor="middle">14</text>
      <rect x="360" y="0" width="80" height="70" rx="14" fill="#161129" stroke="#EC4899" stroke-width="4"/><text x="400" y="45" text-anchor="middle">19</text>
      <rect x="480" y="0" width="80" height="70" rx="14" fill="#161129" stroke="#EF4444" stroke-width="4"/><text x="520" y="45" text-anchor="middle" fill="#EF4444">?</text>
    </g>
    <g stroke="#FFB800" stroke-width="5" stroke-linecap="round">
      <line x1="82" y1="35" x2="118" y2="35"/>
      <line x1="202" y1="35" x2="238" y2="35"/>
      <line x1="322" y1="35" x2="358" y2="35"/>
      <line x1="442" y1="35" x2="478" y2="35"/>
    </g>
    <g font-family="Outfit" font-weight="800" font-size="16" fill="#C4B5FD">
      <text x="100" y="-10" text-anchor="middle">+5</text>
      <text x="220" y="-10" text-anchor="middle">+5</text>
      <text x="340" y="-10" text-anchor="middle">+5</text>
      <text x="460" y="-10" text-anchor="middle">+5</text>
    </g>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(560,180)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#FFB800" stroke-width="10"/>
    <line x1="38" y1="38" x2="80" y2="80" stroke="#FFB800" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Solution card -->
  <g transform="translate(150,340)">
    <rect width="500" height="150" rx="28" fill="#161129" stroke="#10B981" stroke-width="4"/>
    <text x="250" y="50" text-anchor="middle" font-family="Outfit" font-weight="900" font-size="22" fill="#10B981">SOLVING RULE</text>
    <text x="250" y="90" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="20" fill="#F3F4F6">Missing Term = Last Known Term + Step</text>
    <text x="250" y="125" text-anchor="middle" font-family="Outfit" font-weight="900" font-size="24" fill="#FFB800">19 + 5 = 24</text>
  </g>
</svg>
