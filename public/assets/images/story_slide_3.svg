<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1f2a44"/>
      <stop offset="100%" stop-color="#0F0B1E"/>
    </radialGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1440"/>
      <stop offset="100%" stop-color="#140e2c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="50" r="2"/><circle cx="740" cy="70" r="2"/><circle cx="90" cy="560" r="2"/><circle cx="730" cy="550" r="2"/>
  </g>

  <text x="400" y="55" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="32" fill="#FFB800">Real-World Pattern Powers</text>

  <!-- Staircase -->
  <g transform="translate(60,90)">
    <rect width="320" height="200" rx="24" fill="url(#cardB)" stroke="#38BDF8" stroke-width="3"/>
    <text x="160" y="34" text-anchor="middle" font-family="Outfit" font-weight="900" font-size="18" fill="#38BDF8">Staircases</text>
    <g fill="#38BDF8" opacity="0.85">
      <rect x="40" y="150" width="40" height="30"/>
      <rect x="80" y="120" width="40" height="60"/>
      <rect x="120" y="90" width="40" height="90"/>
      <rect x="160" y="60" width="40" height="120"/>
    </g>
    <text x="160" y="192" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="14" fill="#C4B5FD">+18cm per step</text>
  </g>

  <!-- Tiling -->
  <g transform="translate(420,90)">
    <rect width="320" height="200" rx="24" fill="url(#cardB)" stroke="#F472B6" stroke-width="3"/>
    <text x="160" y="34" text-anchor="middle" font-family="Outfit" font-weight="900" font-size="18" fill="#F472B6">Tiling Floors</text>
    <g stroke="#F472B6" stroke-width="1.5" fill="#F472B633">
      <rect x="50" y="55" width="40" height="40"/><rect x="94" y="55" width="40" height="40"/><rect x="138" y="55" width="40" height="40"/><rect x="182" y="55" width="40" height="40"/><rect x="226" y="55" width="40" height="40"/>
      <rect x="50" y="99" width="40" height="40"/><rect x="94" y="99" width="40" height="40"/><rect x="138" y="99" width="40" height="40"/><rect x="182" y="99" width="40" height="40"/><rect x="226" y="99" width="40" height="40"/>
      <rect x="50" y="143" width="40" height="40"/><rect x="94" y="143" width="40" height="40"/><rect x="138" y="143" width="40" height="40"/><rect x="182" y="143" width="40" height="40"/><rect x="226" y="143" width="40" height="40"/>
    </g>
  </g>

  <!-- Ice cream -->
  <g transform="translate(60,320)">
    <rect width="320" height="200" rx="24" fill="url(#cardB)" stroke="#FBBF24" stroke-width="3"/>
    <text x="160" y="34" text-anchor="middle" font-family="Outfit" font-weight="900" font-size="18" fill="#FBBF24">Ice-Cream Combos</text>
    <g font-size="46">
      <text x="60" y="130">🍦</text><text x="130" y="130">🍫</text><text x="200" y="130">🥭</text>
    </g>
    <text x="160" y="180" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="14" fill="#C4B5FD">Flavours × Cones</text>
  </g>

  <!-- PIN code -->
  <g transform="translate(420,320)">
    <rect width="320" height="200" rx="24" fill="url(#cardB)" stroke="#10B981" stroke-width="3"/>
    <text x="160" y="34" text-anchor="middle" font-family="Outfit" font-weight="900" font-size="18" fill="#10B981">PIN Codes</text>
    <g font-family="Outfit" font-weight="900" font-size="26" fill="#F3F4F6">
      <rect x="60" y="60" width="46" height="46" rx="10" fill="#161129" stroke="#10B981" stroke-width="2"/><text x="83" y="90" text-anchor="middle">4</text>
      <rect x="115" y="60" width="46" height="46" rx="10" fill="#161129" stroke="#10B981" stroke-width="2"/><text x="138" y="90" text-anchor="middle">2</text>
      <rect x="170" y="60" width="46" height="46" rx="10" fill="#161129" stroke="#10B981" stroke-width="2"/><text x="193" y="90" text-anchor="middle">7</text>
      <rect x="225" y="60" width="46" height="46" rx="10" fill="#161129" stroke="#10B981" stroke-width="2"/><text x="248" y="90" text-anchor="middle">9</text>
    </g>
    <text x="160" y="150" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="14" fill="#C4B5FD">10 × 10 × 10 × 10 combos</text>
  </g>
</svg>
